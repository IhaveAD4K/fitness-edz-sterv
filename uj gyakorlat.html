
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitTracker – Új gyakorlat</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body class="oldalhatter">

<header class="nav-hatter bg-white">
    <nav id="mySidenav" class="sidenav position-fixed top-0 start-0 h-100 overflow-hidden bg-dark-teal">
        <button type="button" class="btn text-white fs-2 position-absolute top-0 end-0 me-2"
                onclick="closeNav()" aria-label="Menü bezárása">
            <span class="fs-4 nevhatter fw-bold pe-5">
                <span class="text-white">Fit</span>Tracker
            </span>
            &times;
        </button>

        <a href="fooldal.html" class="nav-link text-white p-3">
            <i class="bi bi-house-door me-2"></i>Edzések
        </a>

        <a href="uj gyakorlat.html" class="nav-link text-white p-3">
            <i class="bi bi-plus-circle me-2"></i>Új gyakorlat
        </a>

        <a href="#" class="nav-link text-white p-3"
           data-bs-toggle="modal" data-bs-target="#beallitasok">
            <i class="bi bi-gear me-2"></i>Beállítások
        </a>
    </nav>

    <div id="main" class="p-3 bg-dark-teal d-flex align-items-center">
        <button type="button" class="btn btn-light fs-3"
                onclick="openNav()" aria-label="Menü megnyitása">
            <i class="bi bi-list"></i>
        </button>

        <span class="fs-4 nevhatter fw-bold ms-3">
            <span class="text-white">Fit</span>Tracker
        </span>

        <div class="text-center ms-auto pe-3">
            <button type="button" class="btn narancshatter"
                    data-bs-toggle="modal" data-bs-target="#profilmodal">
                <img width="50" height="50" class="img-fluid rounded-circle"
                     src="kep/images.png" alt="Profilkép">
                <span class="text-white" id="belepettNev">felhasznalonév</span>
            </button>
        </div>
    </div>
</header>

<main>
    <h1 class="narancshatter p-5">Új gyakorlat</h1>

    <div class="gyakorlat-urlap-tarto pt-4">
        <div class="card bg-dark-teal shadow gyakorlat-urlap-kartya">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-white text-center mb-4">Gyakorlat adatai</h2>

                <form id="ujGyakorlatForm">
                    <div class="row g-4">
                        <div class="col-12">
                            <label for="exampleInputEmail1" class="form-label formszoveg">
                                Gyakorlat neve
                            </label>
                            <input type="text" class="form-control nev"
                                   id="exampleInputEmail1" maxlength="60" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="izomCsoport" class="form-label formszoveg">
                                Izomcsoport
                            </label>
                            <select class="form-select izomCsoport" id="izomCsoport" required>
                                <option value="">Válassz!</option>
                                <option value="hát">Hát</option>
                                <option value="váll">Váll</option>
                                <option value="mell">Mell</option>
                                <option value="has">Has</option>
                                <option value="kar">Kar</option>
                                <option value="láb">Láb</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="nehezseg" class="form-label formszoveg">
                                Nehézség
                            </label>
                            <select class="form-select" id="nehezseg" required>
                                <option value="">Válassz!</option>
                                <option>Túl fiatal vagyok a halálhoz</option>
                                <option>Nagyon fájjon</option>
                                <option>Ultra-erőszak</option>
                                <option>Rémálom</option>
                                <option>Ultra rémálom</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="szettek" class="form-label formszoveg">
                                Szettek száma
                            </label>
                            <input type="number" class="form-control" id="szettek"
                                   min="1" max="150" step="1" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="ismetles" class="form-label formszoveg">
                                Ismétlések száma
                            </label>
                            <input type="number" class="form-control" id="ismetles"
                                   min="1" max="50" step="1" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pihenoido" class="form-label formszoveg">
                                Javasolt pihenőidő (másodperc)
                            </label>
                            <input type="number" class="form-control" id="pihenoido"
                                   min="0" max="30" step="1" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="suly" class="form-label formszoveg">
                                Súly (kg)
                            </label>
                            <input type="number" class="form-control" id="suly"
                                   min="0" max="300" step="0.1" required>
                        </div>

                        <div class="col-12 text-center">
                            <button type="submit" class="btn btn-success btn-lg px-5">Mentés
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer class="py-3">
    <p class="text-center mb-0">2026 &copy; bankitatabanya.hu &bull; Minden jog fenntartva!</p>
</footer>

<div class="modal fade" id="uzenetModal" tabindex="-1"
     aria-labelledby="uzenetCim" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="uzenetCim">Értesítés</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>

            <div class="modal-body" id="uzenetSzoveg"></div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Bezárás</button>

                <a href="fooldal.html" id="fooldalGomb"
                   class="btn btn-primary d-none">Vissza a főoldalra</a>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="profilmodal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Profil adatai</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label for="bejelentkezve" class="form-label">Név</label>
                    <input type="text" id="bejelentkezve" class="form-control"
                           minlength="3" maxlength="24">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="edzoimegnevezes" class="form-label">Jelszó</label>
                    <input type="password" id="edzoimegnevezes" class="form-control"
                           minlength="8">
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">Mégse</button>
                <button type="button" class="btn btn-success"
                        onclick="profil.ellenorzes()">Mentés</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="uzenetToast" class="toast text-bg-danger" role="alert" aria-live="assertive">
        <div class="toast-body" id="toastSzoveg"></div>
    </div>
</div>

<div class="modal fade" id="beallitasok" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Beállítások</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>
            <div class="modal-body">
                <p id="weightTitle">Súly mértékegysége [kg]</p>
                <button type="button" class="btn btn-outline-primary" id="kg">kg</button>
                <button type="button" class="btn btn-outline-primary" id="lb">lbs</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/Profil.js"></script>
<script src="js/Gyakorlatok.js"></script>
<script src="js/script.js"></script>

</body>
</html>
