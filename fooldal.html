  <main class="">

    <h1 class="p-5">Edzések</h1>
    <section class="container text-center d-flex justify-content-center flex-wrap gap-5">
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">Mind</button>
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">Hát</button>
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">Váll</button>
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">Mell</button>
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">láb</button>
      <button type="button" class="btn btn-lg gombhatter text-white ps-4 pe-4">Kar</button>
    
    </section>


    <section class="container pt-5 ">
 <div class="row g-4">
    <div class="col-10 col-sm-8 col-md-6 col-lg-4 mx-auto mx-md-0">
      <div class="card shadow h-100 p-3 bg-dark-teal">
        <img src="kep/images.png" class="card-img-top">
        <div class="card-body">
          <div class="accordion" id="accordionMell">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed narancshatter"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mellReszletek"
                        aria-expanded="false"
                        aria-controls="mellReszletek">
                  Gyakorlat részletei
                </button>
              </h2>

              <div id="mellReszletek" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <ul>
                    <li>Fekvenyomás – 4 × 10</li>
                    <li>Tárogatás – 3 × 12</li>
                    <li>Tolódzkodás – 3 × 10</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="col-10 col-sm-8 col-md-6 col-lg-4 mx-auto mx-md-0">
      <div class="card shadow h-100 p-3 bg-dark-teal">
        <img src="kep/images.png" class="card-img-top" >

        <div class="card-body">
          <div class="accordion" id="accordionHat">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed narancshatter"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#hatReszletek"
                        aria-expanded="false"
                        aria-controls="hatReszletek">
                  Gyakorlat részletei
                </button>
              </h2>

              <div id="hatReszletek" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <ul>
                    <li>Húzódzkodás – 4 × 8</li>
                    <li>Evezés – 3 × 12</li>
                    <li>Lehúzás – 3 × 10</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="col-10 col-sm-8 col-md-6 col-lg-4 mx-auto mx-md-0">
      <div class="card shadow h-100 p-3 bg-dark-teal">
        <img src="kep/images.png" class="card-img-top">

        <div class="card-body">
          <div class="accordion" id="accordionLab">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed narancshatter"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#labReszletek"
                        aria-expanded="false"
                        aria-controls="labReszletek">
                  Gyakorlat részletei
                </button>
              </h2>

              <div id="labReszletek" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <ul>
                    <li>Guggolás – 4 × 10</li>
                    <li>Lábtolás – 3 × 12</li>
                    <li>Vádliemelés – 3 × 15</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
